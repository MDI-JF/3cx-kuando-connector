name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version, e.g. 0.1.0-beta.1 or 0.1.0'
        type: string
        required: true
      prerelease:
        description: 'Mark this as a prerelease'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: threecx-kuando-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Validate version and branch
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Releases must originate from main' }
          if ($env:VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(alpha|beta|rc)\.([1-9][0-9]*))?$') { throw 'Invalid semantic version' }
          $hasSuffix = $env:VERSION.Contains('-')
          if ($hasSuffix -ne ($env:PRERELEASE -eq 'true')) { throw 'Prerelease flag does not match version' }
          "TAG=v$env:VERSION" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64 app
        shell: pwsh
        run: dotnet publish src/ThreeCxKuando.App/ThreeCxKuando.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o artifacts/publish
      - name: Build complete installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$env:VERSION" "/DPublishDir=$((Resolve-Path artifacts/publish).Path)" installer/ThreeCxKuando.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Produce checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Filter '*setup.exe' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content artifacts/SHA256SUMS.txt
      - name: Validate release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:TAG already exists" }
      - name: Create release as draft then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $assets = @(Get-ChildItem artifacts -Filter '*setup.exe' | ForEach-Object FullName)
          $assets += (Resolve-Path artifacts/SHA256SUMS.txt).Path
          $args = @('release','create',$env:TAG) + $assets + @('--repo',$env:GITHUB_REPOSITORY,'--target',$env:GITHUB_SHA,'--title',"3CX kuando Connector $env:TAG",'--draft','--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $args += '--prerelease' }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Draft exists, publish failed' }
